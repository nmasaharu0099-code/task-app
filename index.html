<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理アプリ</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%237b6fe0'/%3E%3Cstop offset='100%25' stop-color='%234a6cf7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Crect x='11' y='16' width='13' height='13' rx='3.5' fill='white'/%3E%3Cpolyline points='13.5,22.5 16.5,25.5 22,18.5' fill='none' stroke='%236068f0' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='29' y='20' width='23' height='5' rx='2.5' fill='white'/%3E%3Crect x='11' y='34' width='13' height='13' rx='3.5' fill='white'/%3E%3Cpolyline points='13.5,40.5 16.5,43.5 22,36.5' fill='none' stroke='%236068f0' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='29' y='38' width='17' height='5' rx='2.5' fill='white'/%3E%3Crect x='11' y='50' width='13' height='13' rx='3.5' fill='none' stroke='rgba(255,255,255,0.45)' stroke-width='2'/%3E%3Crect x='29' y='54' width='20' height='5' rx='2.5' fill='rgba(255,255,255,0.35)'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    .container { max-width: 1040px; margin: 0 auto; }

    .main-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .main-content { flex: 1; min-width: 0; }

    /* ---- ヘッダー・タブナビ ---- */
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.7rem; color: #1a202c; margin-bottom: 16px; }

    .view-tabs {
      display: inline-flex;
      gap: 0;
      background: #e2e8f0;
      border-radius: 12px;
      padding: 4px;
    }
    .view-tab {
      padding: 10px 28px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: #718096;
      transition: all 0.2s;
      font-family: inherit;
    }
    .view-tab.active {
      background: white;
      color: #667eea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* ---- カード ---- */
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    /* ---- フォーム ---- */
    .form-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .form-row:last-child { margin-bottom: 0; }

    input[type="text"], input[type="date"], input[type="time"], select {
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      background: white;
      font-family: inherit;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus {
      border-color: #667eea;
    }
    .task-name-input { flex: 1; }
    .cat-select, .type-select { flex: 1; min-width: 0; width: 0; cursor: pointer; }
    .date-input { flex: 1; }

    .btn-primary {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn-primary:hover { background: #5a67d8; }

    /* ---- セクション見出し ---- */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-header span {
      font-size: 0.82rem;
      font-weight: 700;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .btn-add-pill {
      background: none;
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 0.85rem;
      color: #718096;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-add-pill:hover { border-color: #667eea; color: #667eea; }

    /* ---- ピル ---- */
    .pills { display: flex; flex-wrap: wrap; gap: 8px; }

    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .pill.selected { border-color: currentColor; font-weight: 700; }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .pill .remove-pill {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      opacity: 0.4;
      padding: 0;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    .pill .remove-pill:hover { opacity: 1; }

    /* ---- インライン追加フォーム ---- */
    .inline-form { display: none; gap: 8px; margin-top: 10px; }
    .inline-form.visible { display: flex; }
    .inline-form input { flex: 1; }
    .btn-cancel {
      padding: 10px 14px;
      background: none;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.2s;
      white-space: nowrap;
    }
    .btn-cancel:hover { border-color: #a0aec0; }

    /* ---- ステータスフィルター ---- */
    .filter-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      background: #f0f4f8;
      border-radius: 10px;
      padding: 4px;
    }
    .filter-tabs button {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      color: #718096;
      transition: all 0.2s;
      font-family: inherit;
    }
    .filter-tabs button.active {
      background: white;
      color: #667eea;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* ---- タスクグループ ---- */
    .task-group { margin-bottom: 20px; }
    .task-group:last-child { margin-bottom: 0; }
    .task-group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f0f4f8;
      cursor: pointer;
      user-select: none;
    }
    .task-group-header:hover .group-name { color: #667eea; }

    .chevron {
      font-size: 0.7rem;
      color: #a0aec0;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .group-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .group-name { font-weight: 700; color: #2d3748; font-size: 0.95rem; }
    .group-count { font-size: 0.8rem; color: #a0aec0; margin-left: auto; }

    /* ---- タスクアイテム ---- */
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      transition: all 0.2s;
      position: relative;
    }
    .task-item:hover { border-color: #c3dafe; background: #f7f8ff; }
    .task-item.done { background: #f7fafc; }

    .task-item input[type="checkbox"] {
      width: 18px; height: 18px;
      cursor: pointer;
      accent-color: #667eea;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .task-body { flex: 1; min-width: 0; }
    .task-text {
      font-size: 0.95rem;
      color: #2d3748;
      word-break: break-word;
      margin-bottom: 5px;
    }
    .task-item.done .task-text { text-decoration: line-through; color: #a0aec0; }
    .task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* ---- 日付バッジ ---- */
    .due-badge {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .due-overdue { background: #fed7d7; color: #c53030; }
    .due-today   { background: #feebc8; color: #c05621; }
    .due-soon    { background: #fefcbf; color: #975a16; }
    .due-normal  { background: #e6fffa; color: #276749; }
    .due-done    { background: #edf2f7; color: #718096; }

    .repeat-badge {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      background: #e9d8fd;
      color: #6b46c1;
    }
    .repeat-select { flex: 1; cursor: pointer; }

    .priority-badge {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .priority-badge:hover  { opacity: 0.75; }
    .priority-urgent       { background: #9b2335; color: #fff; }
    .priority-high         { background: #fed7d7; color: #c53030; }
    .priority-medium       { background: #feebc8; color: #c05621; }
    .priority-low          { background: #bee3f8; color: #2b6cb0; }

    .list-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .list-controls .filter-tabs { flex: 1; margin-bottom: 0; }

    .sort-btn {
      padding: 8px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      color: #718096;
      background: white;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .sort-btn.active { border-color: #667eea; color: #667eea; background: #ebf4ff; }

    .group-badge {
      font-size: 0.75rem;
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 600;
    }
    .add-priority-btn {
      font-size: 0.78rem;
      color: #a0aec0;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s;
    }
    .add-priority-btn:hover { color: #667eea; }

    .due-area { cursor: pointer; border-radius: 12px; transition: opacity 0.15s; }
    .due-area:hover { opacity: 0.75; }
    .add-date-btn {
      font-size: 0.78rem; color: #a0aec0; cursor: pointer;
      padding: 2px 4px; border-radius: 6px; transition: color 0.15s;
    }
    .add-date-btn:hover { color: #667eea; }
    .inline-date-input {
      padding: 2px 8px; border: 2px solid #667eea;
      border-radius: 8px; font-size: 0.82rem; font-family: inherit; outline: none;
    }

    .delete-btn {
      background: none; border: none; color: #cbd5e0;
      font-size: 1.2rem; cursor: pointer; padding: 0 2px;
      line-height: 1; transition: color 0.2s; flex-shrink: 0;
    }
    .delete-btn:hover { color: #fc8181; }

    .empty-msg {
      text-align: center; color: #a0aec0; padding: 28px 0; font-size: 0.95rem;
    }
    .summary { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 12px; }

    /* ---- 複数案件横並び ---- */
    .task-columns { display: flex; gap: 12px; align-items: flex-start; }
    .task-column  { flex: 1; min-width: 0; }
    .task-column-header {
      font-weight: 700; font-size: 0.9rem;
      padding: 6px 4px; border-bottom: 2px solid;
      margin-bottom: 8px;
    }

    /* ---- ノート ---- */
    .notes-layout { display: flex; gap: 0; min-height: 520px; }
    .notes-sidebar { width: 210px; flex-shrink: 0; border-right: 1px solid #e2e8f0; padding-right: 14px; margin-right: 14px; display: flex; flex-direction: column; }
    .notes-sidebar-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .note-cat-filter { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .note-cat-pill { padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; cursor: pointer; border: 1.5px solid transparent; background: #edf2f7; color: #4a5568; }
    .note-cat-pill.active { font-weight: 700; }
    .note-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; border: 2px solid transparent; }
    .note-item:hover { background: #f7f8ff; }
    .note-item.active { background: #667eea15; border-color: #667eea; }
    .note-item-title { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #2d3748; }
    .note-item-meta  { font-size: 0.75rem; color: #a0aec0; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notes-editor-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .note-title-input { width: 100%; font-size: 1.1rem; font-weight: 700; padding: 6px 4px; border: none; border-bottom: 2px solid #e2e8f0; outline: none; background: transparent; font-family: inherit; color: #1a202c; margin-bottom: 8px; }
    .note-title-input:focus { border-bottom-color: #667eea; }
    .note-meta-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .note-meta-select { padding: 4px 8px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.82rem; outline: none; cursor: pointer; background: white; font-family: inherit; }
    .note-meta-select:focus { border-color: #667eea; }
    .editor-toolbar { display: flex; gap: 4px; padding: 6px 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar-btn { padding: 4px 10px; border: 1.5px solid #e2e8f0; border-radius: 6px; cursor: pointer; background: white; font-size: 0.82rem; font-family: inherit; transition: all 0.15s; }
    .toolbar-btn:hover { background: #667eea; color: white; border-color: #667eea; }
    .toolbar-btn.active { background: #667eea; color: white; border-color: #667eea; }
    .toolbar-sep { width: 1px; background: #e2e8f0; height: 22px; margin: 0 2px; }
    .toolbar-color { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #e2e8f0; cursor: pointer; padding: 0; overflow: hidden; }
    .note-canvas-container { flex: 1; overflow: auto; border: 1.5px solid #e2e8f0; border-radius: 10px; background: #fafafa; position: relative; }
    .note-canvas-container canvas { display: block; }
    .note-empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #a0aec0; font-size: 0.95rem; }
    .note-del-btn { margin-left: auto; padding: 3px 10px; border: 1.5px solid #fc8181; border-radius: 8px; color: #e53e3e; background: white; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
    .note-del-btn:hover { background: #fff5f5; }
    .note-cat-manage { margin-top: auto; padding-top: 10px; border-top: 1px solid #e2e8f0; font-size: 0.78rem; color: #a0aec0; }

    /* ---- 編集モーダル ---- */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal { background: white; border-radius: 16px; padding: 24px; width: 90%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 1rem; font-weight: 700; color: #1a202c; margin-bottom: 16px; }
    .modal-field { margin-bottom: 12px; }
    .modal-label { font-size: 0.8rem; color: #718096; margin-bottom: 4px; }
    .modal-field input[type="text"], .modal-field input[type="date"], .modal-field select { width: 100%; }
    .modal-field textarea { width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; font-family: inherit; resize: vertical; outline: none; transition: border-color 0.2s; }
    .modal-field textarea:focus { border-color: #667eea; }
    .task-memo-icon { font-size: 0.75rem; color: #a0aec0; margin-left: 4px; }
    .task-memo-popup {
      display: none;
      position: absolute;
      left: 0; top: calc(100% + 4px);
      background: #2d3748;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      line-height: 1.5;
      white-space: pre-wrap;
      max-width: 320px;
      z-index: 200;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      pointer-events: none;
      word-break: break-word;
    }
    .task-item:hover .task-memo-popup { display: block; }
    .modal-btns { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
    .edit-btn { background: none; border: none; cursor: pointer; color: #a0aec0; font-size: 0.9rem; padding: 2px 6px; border-radius: 4px; }
    .edit-btn:hover { color: #667eea; background: #667eea15; }

    /* ---- イベント ---- */
    .events-sidebar {
      width: 230px;
      flex-shrink: 0;
      position: sticky;
      top: 24px;
      align-self: flex-start;
    }
    .events-card { padding: 16px 14px; }
    .events-card .section-header { margin-bottom: 6px; }
    .events-card .section-header span:first-child { font-size: 0.8rem; }
    .events-card .btn-add-pill { padding: 3px 10px; font-size: 0.8rem; }

    .ev-meta-text {
      display: block;
      font-size: 0.75rem;
      color: #a0aec0;
      margin-bottom: 8px;
      min-height: 1em;
    }

    .event-form-wrap {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .event-form-wrap.visible { display: flex; }
    .event-form-wrap input {
      width: 100%;
      padding: 7px 10px;
      font-size: 0.85rem;
    }
    .ev-form-btns { display: flex; gap: 6px; }
    .ev-form-btns .btn-primary,
    .ev-form-btns .btn-cancel {
      flex: 1;
      padding: 7px 8px;
      font-size: 0.82rem;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }
    .event-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      transition: border-color 0.2s;
    }
    .event-item:hover { border-color: #c3dafe; }
    .event-item.past  { opacity: 0.45; }

    .ev-badge {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ev-future { background: #e9d8fd; color: #6b46c1; }
    .ev-today  { background: #feebc8; color: #c05621; }
    .ev-past   { background: #edf2f7; color: #718096; }

    .event-time  { font-size: 0.82rem; color: #718096; flex-shrink: 0; }
    .event-title { flex: 1; font-size: 0.92rem; color: #2d3748; word-break: break-word; }
    .events-empty { text-align: center; color: #a0aec0; font-size: 0.9rem; padding: 12px 0; }

    /* ---- ミニカレンダー ---- */
    .mini-cal { margin-bottom: 10px; }
    .cal-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 4px;
    }
    .cal-header span { font-size: 0.82rem; font-weight: 700; color: #2d3748; }
    .cal-header button {
      background: none; border: none; cursor: pointer; color: #718096;
      font-size: 1.1rem; padding: 2px 6px; border-radius: 4px;
      line-height: 1; font-family: inherit; transition: background 0.15s;
    }
    .cal-header button:hover { background: #edf2f7; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .cal-dow {
      font-size: 0.63rem; color: #a0aec0; text-align: center;
      padding: 3px 0; font-weight: 700;
    }
    .cal-day {
      font-size: 0.74rem; text-align: center; padding: 3px 1px;
      border-radius: 5px; cursor: pointer; display: flex;
      flex-direction: column; align-items: center; gap: 1px;
      transition: background 0.15s; line-height: 1.2;
    }
    .cal-day:hover:not(.other-month) { background: #edf2f7; }
    .cal-day.other-month { color: #e2e8f0; cursor: default; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: #f6ad55; }
    .cal-day.today { background: #667eea; color: white; font-weight: 700; }
    .cal-day.today .cal-dot { background: rgba(255,255,255,0.8); }
    .cal-day.selected:not(.today) { background: #c3dafe; color: #2b6cb0; font-weight: 700; }
    .cal-day.in-range:not(.today):not(.selected) { background: #ebf8ff; }

    /* 期間入力フォーム */
    .ev-date-pair { display: flex; flex-direction: column; gap: 4px; }

<div id="app" style="display:none">
<div class="container">

      <span id="user-name"></span>

  </header>

  <div class="main-layout">
    <div class="main-content">

  <!-- ========== 案件タスクビュー ========== -->

    <div class="card">
      <div class="form-row">
        <input type="text" class="task-name-input" id="p-taskInput" placeholder="タスク名を入力..." />

            <select class="note-meta-select" id="note-cat-select" onchange="noteChanged()"><option value="">カテゴリなし</option></select>
            <button class="btn-add-pill" onclick="addNoteCategoryPrompt()" title="カテゴリ追加" style="padding:3px 8px; font-size:0.8rem">＋</button>

            <button class="note-del-btn" onclick="deleteNote()">削除</button>

          <div class="editor-toolbar">
            <button class="toolbar-btn active" id="tool-select" onclick="setNoteTool('select')" title="選択・移動">↖ 選択</button>
            <button class="toolbar-btn" id="tool-text"   onclick="setNoteTool('text')"   title="テキスト追加">T テキスト</button>
            <button class="toolbar-btn" id="tool-rect"   onclick="setNoteTool('rect')"   title="長方形">□ 長方形</button>
            <button class="toolbar-btn" id="tool-circle" onclick="setNoteTool('circle')" title="円">○ 円</button>

<script>
  // ---- Firebase ----
  const firebaseConfig = {
    apiKey:            "AIzaSyAZ-H0t2MJLyCqg2KoZSTfvfxEprOYYRbA",
    authDomain:        "task-app-0099.firebaseapp.com",
    projectId:         "task-app-0099",
    storageBucket:     "task-app-0099.firebasestorage.app",
    messagingSenderId: "646918983718",
    appId:             "1:646918983718:web:48f0f8294c0d9565bc96e7"
  };
  firebase.initializeApp(firebaseConfig);
  const db   = firebase.firestore();
  const auth = firebase.auth();

  function signIn() {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }
  function signOut() { auth.signOut(); }

  let skipNextSnapshot = false;

  function startSync(uid) {
    db.collection('users').doc(uid).collection('data').doc('main')
      .onSnapshot(doc => {
        if (skipNextSnapshot) { skipNextSnapshot = false; return; }
        if (!doc.exists) {
          // localStorageに古いデータがあれば自動移行
          const oldTasks      = JSON.parse(localStorage.getItem('tasks')      || '[]');
          const oldCategories = JSON.parse(localStorage.getItem('categories') || '[]');
          const oldTaskTypes  = JSON.parse(localStorage.getItem('taskTypes')  || 'null');
          const oldEvents     = JSON.parse(localStorage.getItem('events')     || '[]');
          if (oldTasks.length || oldCategories.length || oldEvents.length) {
            tasks      = oldTasks;
            categories = oldCategories;
            taskTypes  = oldTaskTypes || [...DEFAULT_TASK_TYPES];
            events     = oldEvents;
            save();
            renderAll();
            return;
          }
          taskTypes = [...DEFAULT_TASK_TYPES]; renderAll(); return;
        }
        const d = doc.data();
        tasks          = d.tasks          || [];
        categories     = d.categories     || [];
        taskTypes      = d.taskTypes      || [...DEFAULT_TASK_TYPES];
        events         = d.events         || [];
        notes          = d.notes          || [];
        noteCategories = d.noteCategories || [];
        renderAll();
      });
  }

  function renderAll() {
    renderCalendar();
    renderEvents();
    ['project', 'general'].forEach(section => {
      renderGroups(section);
      renderGroupSelect(section);
      renderTasks(section);
    });
    renderNotes();
  }

  auth.onAuthStateChanged(user => {
    const ls = document.getElementById('login-screen');
    const ap = document.getElementById('app');
    if (user) {
      ls.style.display = 'none';
      ap.style.display = '';
      document.getElementById('user-name').textContent = user.displayName || user.email;
      startSync(user.uid);
    } else {
      ls.style.display = '';
      ap.style.display = 'none';
    }
  });

  const COLOR_PALETTE = [
    '#667eea','#f6ad55','#68d391','#fc8181',
    '#76e4f7','#b794f4','#f687b3','#4fd1c5'
  ];

  const DEFAULT_TASK_TYPES = [
    { id: 1000000001, name: '上司依頼', color: '#e53e3e' },
    { id: 1000000002, name: '定期作業', color: '#3182ce' },
  ];

  // section: 'project' | 'general'
  let tasks          = [];
  let categories     = [];
  let taskTypes      = [];
  let notes          = [];
  let noteCategories = [];
  let selectedNoteId       = null;
  let selectedNoteProjectId = null;
  let noteAutoSaveTimer    = null;

  let currentView    = 'project';
  let filters        = { project: 'all', general: 'all' };
  let selectedId     = { project: new Set(), general: null };
  const collapsedGroups = new Set();

  function save() {
    const user = auth.currentUser;
    if (!user) return;
    skipNextSnapshot = true;
    db.collection('users').doc(user.uid).collection('data').doc('main')
      .set({ tasks, categories, taskTypes, events, notes, noteCategories });
  }

  // ---- ビュー切替 ----

  function switchView(view, btn) {
    currentView = view;
    document.getElementById('view-project').style.display = view === 'project' ? '' : 'none';
    document.getElementById('view-general').style.display = view === 'general' ? '' : 'none';
    document.getElementById('view-notes').style.display   = view === 'notes'   ? '' : 'none';
    document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  // ---- グループ（案件 / 種別）管理 ----

  function groupsFor(section) {
    return section === 'project' ? categories : taskTypes;
  }

  function groupKey(section) {
    return section === 'project' ? 'categoryId' : 'typeId';
  }

  function prefix(section) {
    return section === 'project' ? 'p' : 'g';
  }

  function addGroup(section) {
    const p     = prefix(section);
    const input = document.getElementById(`${p}-newCatInput`) || document.getElementById(`${p}-newTypeInput`);
    const name  = input.value.trim();
    if (!name) return;

    const groups = groupsFor(section);
    if (groups.some(g => g.name === name)) { alert('同じ名前がすでにあります'); return; }

    const color = COLOR_PALETTE[groups.length % COLOR_PALETTE.length];
    groups.push({ id: Date.now(), name, color });
    input.value = '';
    toggleInlineForm(`${p}-new${section === 'project' ? 'Cat' : 'Type'}Form`);
    save();
    renderGroups(section);
    renderGroupSelect(section);
  }

  function renameGroup(section, id) {
    const groups = groupsFor(section);
    const group  = groups.find(g => g.id === id);
    if (!group) return;
    const newName = prompt('新しい名前を入力してください', group.name);
    if (!newName || !newName.trim()) return;
    const trimmed = newName.trim();
    if (groups.some(g => g.id !== id && g.name === trimmed)) { alert('同じ名前がすでにあります'); return; }
    group.name = trimmed;
    save();
    renderGroups(section);
    renderGroupSelect(section);
  }

  function deleteGroup(section, id) {
    const label = section === 'project' ? '案件' : '種別';
    const detail = section === 'project'
      ? '案件に属するタスクもすべて削除されます。'
      : '対象タスクの種別設定がなしになります。';
    if (!confirm(`この${label}を削除しますか？\n${detail}`)) return;

    if (section === 'project') {
      categories = categories.filter(c => c.id !== id);
      tasks = tasks.filter(t => t.categoryId !== id);
    } else {
      taskTypes = taskTypes.filter(t => t.id !== id);
      tasks = tasks.map(t => t.typeId === id ? { ...t, typeId: null } : t);
    }
    if (section === 'project') selectedId.project.delete(id);
    else if (selectedId.general === id) selectedId.general = null;
    save();
    renderGroups(section);
    renderGroupSelect(section);
    renderTasks(section);
  }

  function selectGroup(section, id) {
    if (section === 'project') {
      if (id === null) {
        selectedId.project = new Set();
      } else if (selectedId.project.has(id)) {
        selectedId.project.delete(id);
      } else {
        selectedId.project.add(id);
      }
    } else {
      selectedId.general = (id !== null && selectedId.general === id) ? null : id;
    }
    renderGroups(section);
    renderTasks(section);
  }

  function renderGroups(section) {
    const p      = prefix(section);
    const pills  = document.getElementById(`${p}-pills`);
    const groups = groupsFor(section);
    const selId  = selectedId[section];
    pills.innerHTML = '';

    const isAllSelected = section === 'project' ? selectedId.project.size === 0 : selId === null;
    const allPill = document.createElement('div');
    allPill.className = 'pill' + (isAllSelected ? ' selected' : '');
    allPill.style.cssText = 'background:#edf2f7; color:#4a5568;';
    allPill.onclick = () => selectGroup(section, null);
    allPill.innerHTML = `<span class="dot" style="background:#a0aec0"></span>すべて`;
    pills.appendChild(allPill);

    groups.forEach(g => {
      const isSelected = section === 'project' ? selectedId.project.has(g.id) : selId === g.id;
      const pill = document.createElement('div');
      pill.className = 'pill' + (isSelected ? ' selected' : '');
      pill.style.cssText = `background:${g.color}22; color:${g.color};`;
      pill.onclick = () => selectGroup(section, g.id);
      pill.innerHTML = `
        <span class="dot" style="background:${g.color}"></span>
        ${escapeHtml(g.name)}
        <button class="remove-pill" onclick="event.stopPropagation(); renameGroup('${section}', ${g.id})" title="名前変更" style="opacity:0.6; font-size:0.8rem; margin-right:2px">✎</button>
        <button class="remove-pill" onclick="event.stopPropagation(); deleteGroup('${section}', ${g.id})" title="削除">×</button>
      `;
      pills.appendChild(pill);
    });
  }

  function renderGroupSelect(section) {
    const p      = prefix(section);
    const selEl  = document.getElementById(section === 'project' ? `${p}-catSelect` : `${p}-typeSelect`);
    const groups = groupsFor(section);
    const prev   = selEl.value;
    const label  = section === 'project' ? '案件なし' : '種別なし';
    selEl.innerHTML = `<option value="">${label}</option>`;
    groups.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.id;
      opt.textContent = g.name;
      selEl.appendChild(opt);
    });
    selEl.value = prev;
  }

  // ---- タスク操作 ----

  function addTask(section) {
    const p    = prefix(section);
    const text = document.getElementById(`${p}-taskInput`).value.trim();
    if (!text) { document.getElementById(`${p}-taskInput`).focus(); return; }

    const selEl   = document.getElementById(section === 'project' ? `${p}-catSelect` : `${p}-typeSelect`);
    const groupId = selEl.value ? Number(selEl.value) : null;
    const dueDate = document.getElementById(`${p}-dateInput`).value || null;
    const repeatEl = document.getElementById(`${p}-repeatSelect`);
    const repeat   = repeatEl ? repeatEl.value || null : null;

    tasks.push({
      id:         Date.now(),
      section,
      text,
      categoryId: section === 'project' ? groupId : null,
      typeId:     section === 'general' ? groupId : null,
      dueDate,
      repeat,
      done:       false,
    });

    document.getElementById(`${p}-taskInput`).value  = '';
    document.getElementById(`${p}-dateInput`).value  = '';
    save();
    renderTasks(section);
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    task.done = !task.done;
    if (task.done && task.repeat) createNextOccurrence(task);
    save();
    renderTasks(task.section);
  }

  function createNextOccurrence(task) {
    const base = task.dueDate ? new Date(task.dueDate + 'T00:00:00') : new Date();
    const next = new Date(base);
    if (task.repeat === 'weekly')  next.setDate(next.getDate() + 7);
    if (task.repeat === 'monthly') next.setMonth(next.getMonth() + 1);
    const pad = n => String(n).padStart(2, '0');
    const nextDateStr = `${next.getFullYear()}-${pad(next.getMonth()+1)}-${pad(next.getDate())}`;
    tasks.push({
      id:         Date.now() + 1,
      section:    task.section,
      text:       task.text,
      categoryId: task.categoryId,
      typeId:     task.typeId,
      dueDate:    nextDateStr,
      repeat:     task.repeat,
      done:       false,
    });
  }

  function deleteTask(id) {
    const task = tasks.find(t => t.id === id);
    tasks = tasks.filter(t => t.id !== id);
    save();
    renderTasks(task.section);
  }

  function setFilter(section, val, btn) {
    filters[section] = val;
    const p = prefix(section);
    document.querySelectorAll(`#${p}-filterTabs button`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTasks(section);
  }

  // ---- 日付編集 ----

  function openDateEdit(id) {
    const task = tasks.find(t => t.id === id);
    const li   = document.querySelector(`[data-task-id="${id}"]`);
    if (!task || !li) return;

    const metaEl = li.querySelector('.task-meta');
    const input  = document.createElement('input');
    input.type      = 'date';
    input.className = 'inline-date-input';
    input.value     = task.dueDate || '';

    function commit() {
      task.dueDate = input.value || null;
      save();
      renderTasks(task.section);
    }

    input.addEventListener('change', commit);
    input.addEventListener('blur',   commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  input.blur();
      if (e.key === 'Escape') renderTasks(task.section);
    });

    metaEl.innerHTML = '';
    metaEl.appendChild(input);
    input.focus();
    input.showPicker?.();
  }

  // ---- 描画 ----

  function renderTasks(section) {
    const p         = prefix(section);
    const container = document.getElementById(`${p}-taskContainer`);
    const summary   = document.getElementById(`${p}-summary`);
    const key       = groupKey(section);
    const groups    = groupsFor(section);
    const selId     = selectedId[section];
    const filter    = filters[section];
    const projSet   = section === 'project' ? selectedId.project : null;

    const sectionTasks = tasks.filter(t => t.section === section);

    const filtered = sectionTasks.filter(t => {
      if (filter === 'active' && t.done)  return false;
      if (filter === 'done'   && !t.done) return false;
      if (projSet !== null) {
        if (projSet.size > 0 && !projSet.has(t[key])) return false;
      } else {
        if (selId !== null && t[key] !== selId) return false;
      }
      return true;
    });

    container.innerHTML = '';

    if (filtered.length === 0) {
      container.innerHTML = '<p class="empty-msg">タスクがありません</p>';
    } else if (sortByPriority[section]) {
      // 優先度順フラット表示
      const sorted = [...filtered].sort((a, b) => {
        const ra = PRIORITY_RANK[a.priority] ?? 99;
        const rb = PRIORITY_RANK[b.priority] ?? 99;
        if (ra !== rb) return ra - rb;
        return (a.done ? 1 : 0) - (b.done ? 1 : 0);
      });
      container.appendChild(buildTaskList(sorted, true));
    } else if (projSet !== null && projSet.size >= 2) {
      // 複数案件横並び表示
      const colWrap = document.createElement('div');
      colWrap.className = 'task-columns';
      projSet.forEach(gId => {
        const g = groups.find(g => g.id === gId);
        if (!g) return;
        const colItems = filtered.filter(t => t[key] === gId);
        const col = document.createElement('div');
        col.className = 'task-column';
        const hdr = document.createElement('div');
        hdr.className = 'task-column-header';
        hdr.style.cssText = `border-color:${g.color}; color:${g.color}`;
        hdr.innerHTML = `${escapeHtml(g.name)} <span style="color:#a0aec0; font-weight:400">${colItems.length}件</span>`;
        col.appendChild(hdr);
        if (colItems.length === 0) {
          const emp = document.createElement('p');
          emp.className = 'empty-msg';
          emp.textContent = 'タスクがありません';
          col.appendChild(emp);
        } else {
          col.appendChild(buildTaskList(colItems));
        }
        colWrap.appendChild(col);
      });
      container.appendChild(colWrap);
    } else if ((projSet !== null && projSet.size === 1) || (projSet === null && selId !== null)) {
      container.appendChild(buildTaskList(filtered));
    } else {
      const rendered = [];
      groups.forEach(g => {
        const items = filtered.filter(t => t[key] === g.id);
        if (items.length) rendered.push({ g, items });
      });
      const noGroup = filtered.filter(t => !t[key]);
      if (noGroup.length) rendered.push({ g: { name: 'その他', color: '#a0aec0' }, items: noGroup });

      rendered.forEach(({ g, items }) => {
        const gKey      = `${section}-${g.id ?? 'none'}`;
        const collapsed = collapsedGroups.has(gKey);
        const div = document.createElement('div');
        div.className = 'task-group';
        div.innerHTML = `
          <div class="task-group-header" onclick="toggleGroup('${gKey}')">
            <span class="chevron" id="chevron-${gKey}" style="transform:rotate(${collapsed ? '-90deg' : '0deg'})">▼</span>
            <span class="group-dot" style="background:${g.color}"></span>
            <span class="group-name">${escapeHtml(g.name)}</span>
            <span class="group-count">${items.length}件</span>
          </div>
        `;
        const list = buildTaskList(items);
        if (collapsed) list.style.display = 'none';
        div.appendChild(list);
        container.appendChild(div);
      });
    }

    const doneCount = sectionTasks.filter(t => t.done).length;
    summary.textContent = sectionTasks.length > 0
      ? `全${sectionTasks.length}件中 ${doneCount}件完了`
      : '';
  }

  function buildTaskList(arr, showGroup = false) {
    const ul = document.createElement('ul');
    ul.className = 'task-list';
    arr.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');
      li.dataset.taskId = task.id;
      const duePart = task.dueDate
        ? `<span class="due-area" onclick="openDateEdit(${task.id})" title="クリックで日付変更">${dueBadgeHtml(task.dueDate, task.done)}</span>`
        : `<span class="add-date-btn" onclick="openDateEdit(${task.id})">＋ 日付</span>`;
      const repeatLabel = { weekly: '毎週', monthly: '毎月' };
      const repeatPart  = task.repeat
        ? `<span class="repeat-badge">${repeatLabel[task.repeat]}</span>`
        : '';
      const pDef = task.priority ? PRIORITY_DEF[task.priority] : null;
      const priorityPart = pDef
        ? `<span class="priority-badge ${pDef.cls}" onclick="cyclePriority(${task.id})" title="クリックで変更">${pDef.label}</span>`
        : `<span class="add-priority-btn" onclick="cyclePriority(${task.id})">＋ 優先度</span>`;
      const grp = showGroup ? getGroupInfo(task) : null;
      const groupBadge = grp
        ? `<span class="group-badge" style="background:${grp.color}22; color:${grp.color}">${escapeHtml(grp.name)}</span>`
        : '';
      li.innerHTML = `
        <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id})">
        <div class="task-body">
          <div class="task-text">${escapeHtml(task.text)}${task.memo ? `<span class="task-memo-icon" onclick="event.stopPropagation();openTaskEdit(${task.id},true)" style="cursor:pointer">📝</span>` : ''}</div>
          ${task.memo ? `<div class="task-memo-popup">${escapeHtml(task.memo)}</div>` : ''}
          <div class="task-meta">${priorityPart}${duePart}${repeatPart}${groupBadge}</div>
        </div>
        <button class="edit-btn"   onclick="openTaskEdit(${task.id})"  title="編集">✎</button>
        <button class="delete-btn" onclick="deleteTask(${task.id})"  title="削除">×</button>
      `;
      ul.appendChild(li);
    });
    return ul;
  }

  // ---- 日付ユーティリティ ----

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function dueBadgeHtml(dueDate, done) {
    const t    = todayStr();
    const diff = Math.round((new Date(dueDate + 'T00:00:00') - new Date(t + 'T00:00:00')) / 86400000);
    const label = formatDate(dueDate);
    if (done)       return `<span class="due-badge due-done">${label}</span>`;
    if (diff < 0)   return `<span class="due-badge due-overdue">期限切れ (${label})</span>`;
    if (diff === 0) return `<span class="due-badge due-today">今日まで</span>`;
    if (diff <= 3)  return `<span class="due-badge due-soon">あと${diff}日 (${label})</span>`;
    return              `<span class="due-badge due-normal">${label}まで</span>`;
  }

  function formatDate(str) {
    const d = new Date(str + 'T00:00:00');
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---- 優先度 ----

  const PRIORITY_ORDER = [null, 'urgent', 'high', 'medium', 'low'];
  const PRIORITY_RANK  = { urgent: 0, high: 1, medium: 2, low: 3 };
  const PRIORITY_DEF = {
    urgent: { label: '▲ 緊急', cls: 'priority-urgent' },
    high:   { label: '↑ 高',   cls: 'priority-high'   },
    medium: { label: '→ 中',   cls: 'priority-medium' },
    low:    { label: '↓ 低',   cls: 'priority-low'    },
  };

  let sortByPriority = { project: false, general: false };

  function cyclePriority(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const idx = PRIORITY_ORDER.indexOf(task.priority ?? null);
    task.priority = PRIORITY_ORDER[(idx + 1) % PRIORITY_ORDER.length];
    save();
    renderTasks(task.section);
  }

  function toggleSort(section, btn) {
    sortByPriority[section] = !sortByPriority[section];
    btn.classList.toggle('active', sortByPriority[section]);
    renderTasks(section);
  }

  function getGroupInfo(task) {
    if (task.section === 'project' && task.categoryId) {
      const c = categories.find(c => c.id === task.categoryId);
      return c ? { name: c.name, color: c.color } : null;
    }
    if (task.section === 'general' && task.typeId) {
      const t = taskTypes.find(t => t.id === task.typeId);
      return t ? { name: t.name, color: t.color } : null;
    }
    return null;
  }

  // ---- イベント ----

  let events = [];

  function toggleEventForm() {
    const wrap = document.getElementById('event-form-wrap');
    const visible = wrap.classList.toggle('visible');
    if (visible) document.getElementById('ev-title').focus();
  }

  function addEvent() {
    const title   = document.getElementById('ev-title').value.trim();
    const date    = document.getElementById('ev-date').value;
    const endDate = document.getElementById('ev-end-date').value || null;
    const time    = document.getElementById('ev-time').value || null;
    if (!title) { document.getElementById('ev-title').focus(); return; }
    if (!date)  { document.getElementById('ev-date').focus();  return; }
    if (endDate && endDate < date) { alert('終了日は開始日以降にしてください'); return; }

    events.push({ id: Date.now(), title, date, endDate, time });
    ['ev-title','ev-date','ev-end-date','ev-time'].forEach(id => {
      document.getElementById(id).value = '';
    });
    toggleEventForm();
    save();
    renderCalendar();
    renderEvents();
  }

  function deleteEvent(id) {
    events = events.filter(e => e.id !== id);
    save();
    renderCalendar();
    renderEvents();
  }

  function dateInEvent(dateStr, ev) {
    const end = ev.endDate || ev.date;
    return dateStr >= ev.date && dateStr <= end;
  }

  function clearDateFilter() {
    selectedDate = null;
    renderCalendar();
    renderEvents();
  }

  function renderEvents() {
    const list = document.getElementById('events-list');
    const meta = document.getElementById('ev-meta');
    const t    = todayStr();

    const sorted = [...events].sort((a, b) => {
      const aEnd = a.endDate || a.date;
      const bEnd = b.endDate || b.date;
      const aFuture = aEnd >= t;
      const bFuture = bEnd >= t;
      if (aFuture !== bFuture) return aFuture ? -1 : 1;
      return aFuture
        ? (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))
        : bEnd.localeCompare(aEnd);
    });

    const toShow = selectedDate
      ? sorted.filter(ev => dateInEvent(selectedDate, ev))
      : sorted;

    const upcoming = events.filter(e => (e.endDate || e.date) >= t).length;
    if (selectedDate) {
      meta.innerHTML = `${formatDate(selectedDate)} <span class="ev-clear-filter" onclick="clearDateFilter()">× 解除</span>`;
    } else {
      meta.textContent = events.length > 0 ? `直近 ${upcoming}件` : '';
    }

    list.innerHTML = '';
    if (toShow.length === 0) {
      list.innerHTML = `<p class="events-empty">${selectedDate ? 'この日のイベントはありません' : 'イベントはありません'}</p>`;
      return;
    }

    toShow.forEach(ev => {
      const isPast    = (ev.endDate || ev.date) < t;
      const isOngoing = dateInEvent(t, ev);
      const isRange   = ev.endDate && ev.endDate !== ev.date;
      const cls       = isPast ? 'ev-past' : isOngoing ? 'ev-today' : 'ev-future';
      const dateLabel = isRange
        ? `${formatDate(ev.date)}〜${formatDate(ev.endDate)}`
        : formatDate(ev.date) + (isOngoing && !isRange ? '今日' : '');

      const div = document.createElement('div');
      div.className = 'event-item' + (isPast ? ' past' : '');
      div.innerHTML = `
        <span class="ev-badge ${cls}">${dateLabel}</span>
        ${ev.time ? `<span class="event-time">${ev.time}</span>` : ''}
        <span class="event-title">${escapeHtml(ev.title)}</span>
        <button class="delete-btn" onclick="deleteEvent(${ev.id})" title="削除">×</button>
      `;
      list.appendChild(div);
    });
  }

  // ---- カレンダー ----

  let calYear     = new Date().getFullYear();
  let calMonth    = new Date().getMonth();
  let selectedDate = null;

  function calPrev() {
    if (--calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  }
  function calNext() {
    if (++calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  }

  function selectDate(dateStr) {
    selectedDate = selectedDate === dateStr ? null : dateStr;
    renderCalendar();
    renderEvents();
  }

  function renderCalendar() {
    const grid  = document.getElementById('cal-grid');
    const title = document.getElementById('cal-title');
    if (!grid || !title) return;

    const t   = todayStr();
    const pad = n => String(n).padStart(2, '0');
    title.textContent = `${calYear}年${calMonth + 1}月`;

    const DOWS       = ['日','月','火','水','木','金','土'];
    const firstDow   = new Date(calYear, calMonth, 1).getDay();
    const daysInMon  = new Date(calYear, calMonth + 1, 0).getDate();
    const daysInPrev = new Date(calYear, calMonth, 0).getDate();

    grid.innerHTML = '';
    DOWS.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    for (let i = firstDow - 1; i >= 0; i--) {
      const el = document.createElement('div');
      el.className = 'cal-day other-month';
      el.textContent = daysInPrev - i;
      grid.appendChild(el);
    }

    for (let d = 1; d <= daysInMon; d++) {
      const ds       = `${calYear}-${pad(calMonth + 1)}-${pad(d)}`;
      const hasEvent = events.some(ev => dateInEvent(ds, ev));
      const inRange  = hasEvent && events.some(ev => ev.endDate && dateInEvent(ds, ev));
      const isToday  = ds === t;
      const isSel    = ds === selectedDate;

      const cls = ['cal-day',
        isToday             ? 'today'     : '',
        isSel && !isToday   ? 'selected'  : '',
        inRange && !isToday && !isSel ? 'in-range' : '',
        hasEvent            ? 'has-event' : '',
      ].filter(Boolean).join(' ');

      const el = document.createElement('div');
      el.className = cls;
      el.innerHTML = `${d}${hasEvent ? '<span class="cal-dot"></span>' : ''}`;
      el.onclick   = () => selectDate(ds);
      grid.appendChild(el);
    }

    const total = Math.ceil((firstDow + daysInMon) / 7) * 7;
    for (let d = 1; d <= total - firstDow - daysInMon; d++) {
      const el = document.createElement('div');
      el.className = 'cal-day other-month';
      el.textContent = d;
      grid.appendChild(el);
    }
  }

  document.getElementById('ev-title').addEventListener('keydown', e => {
    if (e.key === 'Enter') addEvent();
  });

  // ---- グループ折りたたみ ----

  function toggleGroup(gKey) {
    const chevron = document.getElementById(`chevron-${gKey}`);
    const header  = chevron?.closest('.task-group-header');
    const list    = header?.nextElementSibling;
    if (!list) return;

    if (collapsedGroups.has(gKey)) {
      collapsedGroups.delete(gKey);
      list.style.display = '';
      chevron.style.transform = 'rotate(0deg)';
    } else {
      collapsedGroups.add(gKey);
      list.style.display = 'none';
      chevron.style.transform = 'rotate(-90deg)';
    }
  }

  // ---- インラインフォーム ----

  function toggleInlineForm(id) {
    const form = document.getElementById(id);
    const visible = form.classList.toggle('visible');
    if (visible) form.querySelector('input[type="text"]').focus();
  }

  // ---- キーボード ----

  ['p-taskInput', 'g-taskInput'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask(id.startsWith('p') ? 'project' : 'general');
    });
  });

  ['p-newCatInput', 'g-newTypeInput'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      const section = id.startsWith('p') ? 'project' : 'general';
      if (e.key === 'Enter')  addGroup(section);
      if (e.key === 'Escape') toggleInlineForm(id.startsWith('p') ? 'p-newCatForm' : 'g-newTypeForm');
    });
  });

  // ---- タスク編集モーダル ----

  let editingTaskId = null;

  function openTaskEdit(id, focusMemo = false) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    editingTaskId = id;

    document.getElementById('edit-task-text').value     = task.text     || '';
    document.getElementById('edit-task-date').value     = task.dueDate  || '';
    document.getElementById('edit-task-priority').value = task.priority || '';

    const catSel   = document.getElementById('edit-task-cat');
    const catLabel = document.getElementById('edit-cat-label');
    catSel.innerHTML = '';
    if (task.section === 'project') {
      catLabel.textContent = '案件';
      catSel.innerHTML = '<option value="">案件なし</option>';
      categories.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = c.name;
        catSel.appendChild(o);
      });
      catSel.value = task.categoryId || '';
    } else {
      catLabel.textContent = '種別';
      catSel.innerHTML = '<option value="">種別なし</option>';
      taskTypes.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id; o.textContent = t.name;
        catSel.appendChild(o);
      });
      catSel.value = task.typeId || '';
    }

    document.getElementById('edit-task-memo').value = task.memo || '';
    document.getElementById('task-edit-modal').style.display = 'flex';
    setTimeout(() => {
      if (focusMemo) {
        const memo = document.getElementById('edit-task-memo');
        memo.focus();
        memo.setSelectionRange(memo.value.length, memo.value.length);
      } else {
        document.getElementById('edit-task-text').select();
      }
    }, 50);
  }

  function closeTaskEdit() {
    editingTaskId = null;
    document.getElementById('task-edit-modal').style.display = 'none';
  }

  function saveTaskEdit() {
    if (!editingTaskId) return;
    const task = tasks.find(t => t.id === editingTaskId);
    if (!task) return;

    const newText = document.getElementById('edit-task-text').value.trim();
    if (!newText) { alert('タスク名を入力してください'); return; }

    task.text     = newText;
    task.dueDate  = document.getElementById('edit-task-date').value     || null;
    task.priority = document.getElementById('edit-task-priority').value || null;
    task.memo     = document.getElementById('edit-task-memo').value.trim() || null;

    const catVal = parseInt(document.getElementById('edit-task-cat').value) || null;
    if (task.section === 'project') task.categoryId = catVal;
    else                            task.typeId      = catVal;

    save();
    renderTasks(task.section);
    closeTaskEdit();
  }

  document.getElementById('edit-task-text').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveTaskEdit();
    if (e.key === 'Escape') closeTaskEdit();
  });

  // 初期描画は auth.onAuthStateChanged → startSync → renderAll() で行われる

  // ---- ノート ----

  function renderNotes() {
    renderNoteCatFilter();
    renderNoteList();
    renderNoteCatSelect();
    renderNoteProjSelect();
  }

  function renderNoteCatFilter() {
    // 案件フィルタ
    const el = document.getElementById('note-proj-filter');
    if (!el) return;
    el.innerHTML = '';
    const allPill = document.createElement('span');
    allPill.className = 'note-cat-pill' + (selectedNoteProjectId === null ? ' active' : '');
    if (selectedNoteProjectId === null) allPill.style.cssText = 'background:#667eea22; color:#667eea; border-color:#667eea; font-weight:700';
    allPill.textContent = 'すべて';
    allPill.onclick = () => { selectedNoteProjectId = null; renderNotes(); };
    el.appendChild(allPill);
    categories.forEach(c => {
      const p = document.createElement('span');
      const isActive = selectedNoteProjectId === c.id;
      p.className = 'note-cat-pill' + (isActive ? ' active' : '');
      p.style.cssText = `background:${c.color}22; color:${c.color}; border-color:${isActive ? c.color : 'transparent'}`;
      p.textContent = c.name;
      p.onclick = () => { selectedNoteProjectId = c.id; renderNotes(); };
      el.appendChild(p);
    });
  }

  function renderNoteList() {
    const el = document.getElementById('note-list-container');
    if (!el) return;
    el.innerHTML = '';

    const filtered = selectedNoteProjectId === null
      ? [...notes]
      : notes.filter(n => n.projectId === selectedNoteProjectId);

    if (filtered.length === 0) {
      el.innerHTML = '<p style="font-size:0.8rem; color:#a0aec0; padding:8px 0">ノートがありません</p>';
      return;
    }

    if (selectedNoteProjectId !== null) {
      // 特定案件：フラット表示（更新日時順）
      filtered.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      filtered.forEach(n => el.appendChild(buildNoteItem(n)));
    } else {
      // すべて：案件ごとにグループ表示
      const groups = [];
      categories.forEach(c => {
        const items = filtered.filter(n => n.projectId === c.id);
        if (items.length) groups.push({ label: c.name, color: c.color, items });
      });
      const noProj = filtered.filter(n => !n.projectId);
      if (noProj.length) groups.push({ label: '案件なし', color: '#a0aec0', items: noProj });

      groups.forEach(g => {
        const hdr = document.createElement('div');
        hdr.style.cssText = `font-size:0.78rem; font-weight:700; color:${g.color}; padding:6px 2px 3px; margin-top:6px; border-bottom:1.5px solid ${g.color}44;`;
        hdr.textContent = g.label;
        el.appendChild(hdr);
        g.items.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        g.items.forEach(n => el.appendChild(buildNoteItem(n)));
      });
    }
  }

  function buildNoteItem(n) {
    const div = document.createElement('div');
    div.className = 'note-item' + (n.id === selectedNoteId ? ' active' : '');
    const cat = noteCategories.find(c => c.id === n.noteCatId);
    div.innerHTML = `
      <div class="note-item-title">${escapeHtml(n.title) || '（タイトルなし）'}</div>
      <div class="note-item-meta">${cat ? `<span style="color:${cat.color}">${escapeHtml(cat.name)}</span>` : '&nbsp;'}</div>
    `;
    div.onclick = () => selectNote(n.id);
    return div;
  }

  function renderNoteCatSelect() {
    const el = document.getElementById('note-cat-select');
    if (!el) return;
    const prev = el.value;
    el.innerHTML = '<option value="">カテゴリなし</option>';
    noteCategories.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.name;
      el.appendChild(o);
    });
    el.value = prev;
  }

  function renderNoteProjSelect() {
    const el = document.getElementById('note-proj-select');
    if (!el) return;
    const prev = el.value;
    el.innerHTML = '<option value="">案件なし</option>';
    categories.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.name;
      el.appendChild(o);
    });
    el.value = prev;
  }

  // ---- Fabric.js キャンバス ----
  let noteCanvas = null;
  let noteTool = 'select';
  let noteDrawStart = null;
  let noteDrawShape = null;

  function initNoteCanvas() {
    const container = document.getElementById('note-canvas-container');
    const w = Math.max(container.clientWidth - 4, 400);
    window.removeEventListener('paste', onNoteImagePaste);
    if (noteCanvas) {
      noteCanvas.off();
      noteCanvas.dispose();
    }
    noteCanvas = new fabric.Canvas('note-canvas', {
      width: w, height: 520, backgroundColor: 'white', selection: true
    });
    noteCanvas.on('object:modified', noteChanged);
    noteCanvas.on('object:added',    noteChanged);
    noteCanvas.on('object:removed',  noteChanged);

    // 図形描画
    noteCanvas.on('mouse:down', opt => {
      if (noteTool === 'select' || noteTool === 'text') return;
      noteCanvas.selection = false;
      const p = noteCanvas.getPointer(opt.e);
      noteDrawStart = p;
      const stroke = document.getElementById('stroke-color').value;
      const fillNone = document.getElementById('fill-none').checked;
      const fill = fillNone ? 'transparent' : document.getElementById('fill-color').value;
      if (noteTool === 'rect') {
        noteDrawShape = new fabric.Rect({ left: p.x, top: p.y, width: 0, height: 0, stroke, strokeWidth: 2, fill, selectable: false });
      } else {
        noteDrawShape = new fabric.Ellipse({ left: p.x, top: p.y, rx: 0, ry: 0, stroke, strokeWidth: 2, fill, selectable: false });
      }
      noteCanvas.add(noteDrawShape);
    });
    noteCanvas.on('mouse:move', opt => {
      if (!noteDrawShape || !noteDrawStart) return;
      const p = noteCanvas.getPointer(opt.e);
      const dx = p.x - noteDrawStart.x, dy = p.y - noteDrawStart.y;
      if (noteTool === 'rect') {
        noteDrawShape.set({ left: Math.min(p.x, noteDrawStart.x), top: Math.min(p.y, noteDrawStart.y), width: Math.abs(dx), height: Math.abs(dy) });
      } else {
        noteDrawShape.set({ left: Math.min(p.x, noteDrawStart.x), top: Math.min(p.y, noteDrawStart.y), rx: Math.abs(dx)/2, ry: Math.abs(dy)/2 });
      }
      noteCanvas.renderAll();
    });
    noteCanvas.on('mouse:up', () => {
      if (!noteDrawShape) return;
      noteDrawShape.set({ selectable: true });
      noteCanvas.setActiveObject(noteDrawShape);
      noteDrawShape = null; noteDrawStart = null;
      noteCanvas.selection = true;
    });

    // テキスト追加
    noteCanvas.on('mouse:down', opt => {
      if (noteTool !== 'text') return;
      const p = noteCanvas.getPointer(opt.e);
      const tb = new fabric.IText('テキスト', { left: p.x, top: p.y, fontSize: 16, fill: '#1a202c', fontFamily: 'Segoe UI, sans-serif' });
      noteCanvas.add(tb);
      noteCanvas.setActiveObject(tb);
      tb.enterEditing();
      tb.selectAll();
      setNoteTool('select');
    });

    // 画像ペースト
    window.addEventListener('paste', onNoteImagePaste);
  }

  function destroyNoteCanvas() {
    window.removeEventListener('paste', onNoteImagePaste);
    if (noteCanvas) { noteCanvas.off(); noteCanvas.dispose(); noteCanvas = null; }
  }

  function onNoteImagePaste(e) {
    if (!selectedNoteId || !noteCanvas) return;
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const blob = item.getAsFile();
        const reader = new FileReader();
        reader.onload = ev => {
          const dataUrl = ev.target.result;
          fabric.Image.fromURL(dataUrl, img => {
            const maxW = noteCanvas.getWidth() - 40;
            if (img.width > maxW) img.scaleToWidth(maxW);
            img.set({ left: 20, top: 20 });
            noteCanvas.add(img);
            noteCanvas.setActiveObject(img);
            noteCanvas.renderAll();
            noteChanged();
          });
        };
        reader.readAsDataURL(blob);
        e.preventDefault();
        break;
      }
    }
  }

  function noteAddImageFile(input) {
    if (!input.files[0] || !noteCanvas) return;
    const reader = new FileReader();
    reader.onload = ev => {
      fabric.Image.fromURL(ev.target.result, img => {
        const maxW = noteCanvas.getWidth() - 40;
        if (img.width > maxW) img.scaleToWidth(maxW);
        img.set({ left: 20, top: 20 });
        noteCanvas.add(img);
        noteCanvas.setActiveObject(img);
        noteCanvas.renderAll();
        noteChanged();
      });
    };
    reader.readAsDataURL(input.files[0]);
    input.value = '';
  }

  function setNoteTool(tool) {
    noteTool = tool;
    document.querySelectorAll('.editor-toolbar .toolbar-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('tool-' + tool);
    if (btn) btn.classList.add('active');
    if (noteCanvas) {
      noteCanvas.isDrawingMode = false;
      noteCanvas.defaultCursor = tool === 'select' ? 'default' : tool === 'text' ? 'text' : 'crosshair';
    }
  }

  function updateNoteColors() {
    if (!noteCanvas) return;
    const obj = noteCanvas.getActiveObject();
    if (!obj) return;
    const stroke = document.getElementById('stroke-color').value;
    const fillNone = document.getElementById('fill-none').checked;
    const fill = fillNone ? 'transparent' : document.getElementById('fill-color').value;
    obj.set({ stroke, fill });
    noteCanvas.renderAll();
    noteChanged();
  }

  function noteDeleteSelected() {
    if (!noteCanvas) return;
    const obj = noteCanvas.getActiveObject();
    if (!obj) return;
    if (obj.type === 'activeSelection') {
      obj.forEachObject(o => noteCanvas.remove(o));
      noteCanvas.discardActiveObject();
    } else {
      noteCanvas.remove(obj);
    }
    noteCanvas.renderAll();
  }

  function selectNote(id) {
    clearTimeout(noteAutoSaveTimer);
    if (selectedNoteId && selectedNoteId !== id) saveNoteContent();
    selectedNoteId = id;
    const note = notes.find(n => n.id === id);
    if (!note) return;
    document.getElementById('note-empty-state').style.display = 'none';
    document.getElementById('note-editor-panel').style.display = 'flex';
    document.getElementById('note-title-input').value = note.title || '';
    renderNoteCatSelect();
    renderNoteProjSelect();
    document.getElementById('note-cat-select').value  = note.noteCatId  || '';
    document.getElementById('note-proj-select').value = note.projectId  || '';

    // キャンバス初期化してデータ読み込み
    setTimeout(() => {
      initNoteCanvas();
      if (note.canvasJson) {
        noteCanvas.loadFromJSON(note.canvasJson, () => noteCanvas.renderAll());
      }
    }, 30);
    renderNoteList();
  }

  function addNote() {
    clearTimeout(noteAutoSaveTimer);
    if (selectedNoteId) saveNoteContent();
    const note = { id: Date.now(), title: '', canvasJson: null, noteCatId: null, projectId: selectedNoteProjectId, updatedAt: Date.now() };
    notes.unshift(note);
    save();
    selectedNoteId = note.id;
    renderNotes();
    selectNote(note.id);
    setTimeout(() => document.getElementById('note-title-input').focus(), 80);
  }

  function deleteNote() {
    if (!selectedNoteId) return;
    if (!confirm('このノートを削除しますか？')) return;
    destroyNoteCanvas();
    notes = notes.filter(n => n.id !== selectedNoteId);
    selectedNoteId = null;
    save();
    document.getElementById('note-editor-panel').style.display = 'none';
    document.getElementById('note-empty-state').style.display = '';
    renderNoteList();
  }

  function noteChanged() {
    clearTimeout(noteAutoSaveTimer);
    noteAutoSaveTimer = setTimeout(saveNoteContent, 1000);
  }

  function saveNoteContent() {
    if (!selectedNoteId || !noteCanvas) return;
    const note = notes.find(n => n.id === selectedNoteId);
    if (!note) return;
    note.title     = document.getElementById('note-title-input').value;
    note.canvasJson = JSON.stringify(noteCanvas.toJSON());
    note.noteCatId = parseInt(document.getElementById('note-cat-select').value)  || null;
    note.projectId = parseInt(document.getElementById('note-proj-select').value) || null;
    note.updatedAt = Date.now();
    save();
    renderNoteList();
  }

  function fmt() {} // 旧API互換（呼び出し残り対策）

  function addNoteCategoryPrompt() {
    const name = prompt('新しいカテゴリ名を入力してください');
    if (!name || !name.trim()) return;
    const trimmed = name.trim();
    if (noteCategories.some(c => c.name === trimmed)) { alert('同じ名前がすでにあります'); return; }
    const color = COLOR_PALETTE[noteCategories.length % COLOR_PALETTE.length];
    const newCat = { id: Date.now(), name: trimmed, color };
    noteCategories.push(newCat);
    save();
    renderNoteCatSelect();
    document.getElementById('note-cat-select').value = newCat.id;
    noteChanged();
  }
</script>
</body>
